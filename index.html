<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Lívia ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to top, #ff9a9e 0%, #fecfef 100%); 
            height: 100vh;
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        /* --- ESTILOS DA TELA INICIAL (LOVE BAR) --- */
        #firstScreen {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #instruction {
            color: #c0392b;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        #loveBarContainer {
            width: 80%;
            max-width: 500px;
            height: 40px;
            background-color: #ffffff;
            border-radius: 20px;
            border: 3px solid #c0392b;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        #loveBar {
            height: 100%;
            width: 0%; /* Começa vazia */
            background-color: #ff4d4d;
            transition: width 0.1s linear; /* Anima o enchimento */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: white;
            font-weight: bold;
        }

        /* --- ESTILOS DA CONTAGEM REGRESSIVA (SEM ALTERAÇÃO) --- */
        #countdown {
            display: none;
            font-size: 100px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 4px 4px #c0392b;
            position: relative;
            z-index: 20;
        }

        /* --- ESTILOS DA SURPRESA (MURAL DE FOTOS - SEM ALTERAÇÃO) --- */
        #surprise {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s;
            position: absolute; 
            max-width: 95%; 
            max-height: 95vh;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            overflow-y: auto; 
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #photo-grid {
            width: 100%;
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 10px; 
            justify-items: center;
            align-items: start;
        }
        
        #surprise h1 {
            color: #c0392b;
            font-size: 36px; 
            margin-bottom: 5px;
            text-align: center;
        }

        #surprise p {
            color: #555;
            font-size: 22px; 
            text-align: center;
            line-height: 1.5;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        #photo-grid img {
            width: 100%; 
            height: auto;
            border-radius: 8px;
            object-fit: cover; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div id="firstScreen">
        <div id="instruction">Pressione a barra de espaço para encher a barra do amor!</div>
        <div id="loveBarContainer">
            <div id="loveBar">0%</div>
        </div>
    </div>

    <div id="countdown"></div>

    <div id="surprise"> 
        <h1>Para Lívia Rodrigues ❤️</h1>
        <p>
            Meu amor, você é uma mulher incrível e eu sou seu fã. Te amo meu amor e obrigado por fazer minha vida ter mais sentido.
        </p>
        <div id="photo-grid">
            <img src="foto.jpg" alt="Foto 1">
            <img src="foto2.jpg" alt="Foto 2">
            <img src="foto3.jpg" alt="Foto 3">
            <img src="foto4.jpg" alt="Foto 4">
            <img src="foto5.jpg" alt="Foto 5">
        </div>
    </div>

    <script>
        const firstScreen = document.getElementById('firstScreen'); 
        const surprise = document.getElementById('surprise');
        const countdownElement = document.getElementById('countdown');
        const loveBar = document.getElementById('loveBar');

        let loveLevel = 0; // Nível atual do amor
        const maxLove = 20; // Número de vezes que precisa apertar ESPAÇO

        // Variável para evitar que a contagem seja acionada várias vezes
        let gameActive = true; 

        // Lógica de interação com o teclado
        document.addEventListener('keydown', (event) => {
            // Verifica se a tecla é o ESPAÇO (keyCode 32 ou key ' ') e se o jogo está ativo
            if (gameActive && (event.keyCode === 32 || event.key === ' ')) {
                event.preventDefault(); // Impede que o espaço role a página

                if (loveLevel < maxLove) {
                    loveLevel++;
                    const percentage = Math.round((loveLevel / maxLove) * 100);
                    
                    // Atualiza a barra visual
                    loveBar.style.width = percentage + '%';
                    loveBar.textContent = percentage + '%';
                }

                if (loveLevel >= maxLove) {
                    gameActive = false; // Desativa o jogo após a barra encher
                    startCountdown();
                }
            }
        });

        // Função de Contagem Regressiva e Revelação (Sem alterações)
        function startCountdown() {
            
            // Lógica de Transição
            firstScreen.style.display = 'none';
            
            countdownElement.style.display = 'flex';
            countdownElement.textContent = '3';

            setTimeout(() => {
                countdownElement.textContent = '2';
            }, 1000);

            setTimeout(() => {
                countdownElement.textContent = '1';
            }, 2000);

            // REVELAÇÃO DA SURPRESA
            setTimeout(() => {
                countdownElement.style.display = 'none';
                
                surprise.style.visibility = 'visible'; 
                surprise.style.opacity = '1';         
            }, 3000);
        }
    </script>

</body>
</html>
