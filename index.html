<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Lívia ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to top, #ff9a9e 0%, #fecfef 100%); 
            height: 100vh;
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            z-index: 10; 
        }

        /* --- ESTILOS DO BOTÃO E CONTAGEM (SEM ALTERAÇÃO) --- */
        #firstButton {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background-color: #ffffff;
            color: #c0392b;
            font-weight: bold;
            transition: transform 0.2s; 
            position: absolute; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); 
        }

        #firstButton:hover {
            transform: scale(1.05);
            background-color: #ffe6e6;
        }

        #countdown {
            display: none;
            font-size: 100px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 4px 4px #c0392b;
            position: relative;
            z-index: 20;
        }

        /* --- ESTILOS DA SURPRESA (NOVO LAYOUT PARA FOTOS) --- */
        #surprise {
            display: none; 
            max-width: 95%; /* Aumenta um pouco para caber mais fotos */
            max-height: 95vh;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            position: relative;
            overflow-y: auto; /* Permite rolar se as fotos forem muitas */
            
            /* NOVO CSS: Usamos GRID para criar o mural */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); /* 150px é o tamanho mínimo de cada foto */
            gap: 10px; /* Espaço entre as fotos */
            justify-items: center;
            align-items: start;
        }

        .text-container {
            /* Ocupa a largura total na grade, centralizado */
            grid-column: 1 / -1; 
            text-align: center;
        }
        
        #surprise img {
            width: 100%; /* Fotos ocupam 100% da sua célula na grid */
            height: auto;
            border-radius: 8px;
            /* Removemos max-width: 80% para que a grid controle o tamanho */
            object-fit: cover; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #c0392b;
            font-size: 36px; 
            margin-bottom: 5px;
        }

        p {
            color: #555;
            font-size: 22px; 
            text-align: center;
            line-height: 1.5;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div class="container" id="firstScreen">
        <button id="firstButton">CLIQUE AQUI ❤️</button>
    </div>

    <div id="countdown"></div>

    <div class="container" id="surprise">
        
        <div class="text-container">
            <h1>Para Lívia Rodrigues ❤️</h1>
            <p>
                Meu amor, você é uma mulher incrível e eu sou seu fã. Te amo meu amor e obrigado por fazer minha vida ter mais sentido.
            </p>
        </div>

        <img src="foto.jpg" alt="Foto 1">
        <img src="foto2.jpg" alt="Foto 2">
        <img src="foto3.jpg" alt="Foto 3">
        <img src="foto4.jpg" alt="Foto 4">
        <img src="foto5.jpg" alt="Foto 5">
        </div>

    <script>
        const firstScreen = document.getElementById('firstScreen'); 
        const firstButton = document.getElementById('firstButton');
        const surprise = document.getElementById('surprise');
        const countdownElement = document.getElementById('countdown');
        let clickIndex = 0;

        const targetPositions = [
            { x: 20, y: 20 },
            { x: 75, y: 40 }, 
            { x: 50, y: 50 }, 
            { x: 30, y: 80 }, 
            { x: 80, y: 15 }  
        ];

        function moveToNextTarget() {
            if (clickIndex < targetPositions.length) {
                const target = targetPositions[clickIndex];
                
                const newX = (window.innerWidth * target.x / 100) - (firstButton.offsetWidth / 2);
                const newY = (window.innerHeight * target.y / 100) - (firstButton.offsetHeight / 2);

                firstButton.style.left = newX + 'px';
                firstButton.style.top = newY + 'px';
            }
        }

        firstButton.addEventListener('click', () => {
            
            if (clickIndex === targetPositions.length - 1) {
                
                // --- LÓGICA DA CONTAGEM REGRESSIVA ---
                firstButton.style.display = 'none';
                
                countdownElement.style.display = 'flex';
                countdownElement.textContent = '3';

                setTimeout(() => {
                    countdownElement.textContent = '2';
                }, 1000);

                setTimeout(() => {
                    countdownElement.textContent = '1';
                }, 2000);

                setTimeout(() => {
                    countdownElement.style.display = 'none';
                    firstScreen.style.display = 'none';
                    // AJUSTE: O display: grid é definido no CSS.
                    surprise.style.display = 'grid'; 
                }, 3000);

                firstButton.disabled = true;

            } else {
                clickIndex++;
                moveToNextTarget();
            }
        });

        window.addEventListener('load', () => {
            moveToNextTarget();
        });
        
    </script>

</body>
</html>
