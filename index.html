<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Lívia ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f28b8b;
            height: 100vh;
            display: flex; /* Centraliza TUDO na tela */
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10; 
        }

        /* --- ESTILOS DO BOTÃO --- */
        #firstButton {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background-color: #ffffff;
            color: #c0392b;
            font-weight: bold;
            transition: transform 0.2s; 
            position: absolute; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); 
        }

        #firstButton:hover {
            transform: scale(1.05);
            background-color: #ffe6e6;
        }

        /* --- ESTILOS DA CONTAGEM REGRESSIVA --- */
        #countdown {
            display: none; /* Começa escondido */
            font-size: 100px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 4px 4px #c0392b; /* Para destacar o número */
            position: relative;
            z-index: 20;
        }

        /* --- ESTILOS DA SURPRESA --- */
        #surprise {
            display: none; 
            max-width: 90%;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            position: relative;
            
            flex-direction: column; 
            justify-content: center;
            align-items: center;
        }

        #surprise img {
            max-width: 80%; 
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1 {
            color: #c0392b;
            font-size: 36px; 
        }

        p {
            color: #555;
            font-size: 22px; 
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container" id="firstScreen">
        <button id="firstButton">CLIQUE AQUI ❤️</button>
    </div>

    <div id="countdown"></div>

    <div class="container" id="surprise">
        <h1>Para Lívia Rodrigues ❤️</h1>
        <img src="foto.jpg" alt="Nossa foto">
        <p>
            Meu amor, você é uma mulher incrível e eu sou seu fã. Te amo meu amor e obrigado por fazer minha vida ter mais sentido.
        </p>
    </div>

    <script>
        const firstScreen = document.getElementById('firstScreen'); 
        const firstButton = document.getElementById('firstButton');
        const surprise = document.getElementById('surprise');
        const countdownElement = document.getElementById('countdown'); // Referência para a contagem
        let clickIndex = 0;

        const targetPositions = [
            { x: 20, y: 20 },
            { x: 75, y: 40 }, 
            { x: 50, y: 50 }, 
            { x: 30, y: 80 }, 
            { x: 80, y: 15 }  
        ];

        function moveToNextTarget() {
            if (clickIndex < targetPositions.length) {
                const target = targetPositions[clickIndex];
                
                const newX = (window.innerWidth * target.x / 100) - (firstButton.offsetWidth / 2);
                const newY = (window.innerHeight * target.y / 100) - (firstButton.offsetHeight / 2);

                firstButton.style.left = newX + 'px';
                firstButton.style.top = newY + 'px';
            }
        }

        firstButton.addEventListener('click', () => {
            
            if (clickIndex === targetPositions.length - 1) {
                
                // --- LÓGICA DA CONTAGEM REGRESSIVA ---
                firstButton.style.display = 'none'; // 1. Oculta o botão
                
                countdownElement.style.display = 'flex'; // 2. Mostra a contagem
                countdownElement.textContent = '3';

                // Contagem 2
                setTimeout(() => {
                    countdownElement.textContent = '2';
                }, 1000);

                // Contagem 1
                setTimeout(() => {
                    countdownElement.textContent = '1';
                }, 2000);

                // Revela a surpresa após 3 segundos
                setTimeout(() => {
                    countdownElement.style.display = 'none'; // Esconde a contagem
                    firstScreen.style.display = 'none'; // Garante que a tela do botão suma
                    surprise.style.display = 'flex'; // Mostra a surpresa
                }, 3000);

                firstButton.disabled = true; // Impede cliques posteriores

            } else {
                // Move para o próximo alvo
                clickIndex++;
                moveToNextTarget();
            }
        });

        window.addEventListener('load', () => {
            moveToNextTarget();
        });
        
    </script>

</body>
</html>
