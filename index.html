<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Lívia ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f28b8b;
            height: 100vh;
            display: flex; /* Centraliza TUDO na tela */
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10; 
        }

        /* --- ESTILOS DO BOTÃO --- */
        #firstButton {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background-color: #ffffff;
            color: #c0392b;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
            /* AJUSTE: Voltamos para position: absolute para que ele possa fugir */
            position: absolute; 
        }

        #firstButton:hover {
            transform: scale(1.05);
            background-color: #ffe6e6;
        }

        /* --- ESTILOS DA SURPRESA --- */
        #surprise {
            display: none; 
            max-width: 90%;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            position: relative;
            
            flex-direction: column; 
            justify-content: center;
            align-items: center;
        }

        #surprise img {
            max-width: 80%; 
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1 {
            color: #c0392b;
            /* Tamanho final do título */
            font-size: 36px; 
        }

        p {
            color: #555;
            /* Tamanho final do parágrafo */
            font-size: 22px; 
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container" id="firstScreen">
        <button id="firstButton">CLIQUE AQUI ❤️</button>
    </div>

    <div class="container" id="surprise">
        <h1>Para Lívia Rodrigues ❤️</h1>
        <img src="foto.jpg" alt="Nossa foto">
        <p>
            Meu amor, você é uma mulher incrível e eu sou seu fã. Te amo meu amor e obrigado por fazer minha vida ter mais sentido.
        </p>
    </div>

    <script>
        // Restaura o contador de cliques
        const firstScreen = document.getElementById('firstScreen'); 
        const firstButton = document.getElementById('firstButton');
        const surprise = document.getElementById('surprise');
        let clicks = 0; // Restaurado

        function moveButtonRandom() {
            const x = Math.random() * (window.innerWidth - firstButton.offsetWidth);
            const y = Math.random() * (window.innerHeight - firstButton.offsetHeight);
            firstButton.style.left = x + 'px';
            firstButton.style.top = y + 'px';
        }

        // AJUSTE: Restaura a função de fugir ao passar o mouse
        firstButton.addEventListener('mouseover', () => {
            moveButtonRandom();
        });

        // AJUSTE: Restaura a lógica de 5 cliques
        firstButton.addEventListener('click', () => {
            clicks++;
            if (clicks < 5) {
                // Move o botão rapidamente mais 3 vezes para dificultar
                for (let i = 0; i < 3; i++) {
                    setTimeout(moveButtonRandom, Math.random() * 100);
                }
            } else {
                // Revela a surpresa
                firstScreen.style.display = 'none'; 
                surprise.style.display = 'flex'; 
            }
        });

        // Posiciona o botão no início
        moveButtonRandom(); 
    </script>

</body>
</html>
