<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Lívia ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to top, #ff9a9e 0%, #fecfef 100%); 
            height: 100vh;
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        /* --- ESTILOS DA TELA INICIAL (SEM ALTERAÇÃO) --- */
        #firstScreen {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #firstButton {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background-color: #ffffff;
            color: #c0392b;
            font-weight: bold;
            transition: transform 0.2s; 
            position: absolute; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); 
        }

        #firstButton:hover {
            transform: scale(1.05);
            background-color: #ffe6e6;
        }

        /* --- ESTILOS DA CONTAGEM REGRESSIVA (SEM ALTERAÇÃO) --- */
        #countdown {
            display: none;
            font-size: 100px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 4px 4px #c0392b;
            position: relative;
            z-index: 20;
        }

        /* --- ESTILOS DA SURPRESA (NOVO LAYOUT) --- */
        #surprise {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s;
            
            position: absolute;
            max-width: 95%; 
            max-height: 95vh;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            overflow-y: auto; 
            z-index: 5;
            
            /* Novo: Organiza Texto e Fotos verticalmente no topo */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        
        /* NOVO ESTILO: Contêiner que SÓ CONTÉM AS FOTOS e usa GRID */
        #photo-grid {
            width: 100%; /* Ocupa a largura máxima dentro do #surprise */
            margin-top: 15px;
            
            /* CSS para o Mural: Fotos em colunas */
            display: grid;
            /* AJUSTE: O minmax foi aumentado para forçar fotos maiores */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 10px; 
            justify-items: center;
            align-items: start;
        }
        
        /* O text-container agora é desnecessário pois o Flexbox faz o trabalho */
        #surprise h1 {
            color: #c0392b;
            font-size: 36px; 
            margin-bottom: 5px;
            text-align: center;
        }

        #surprise p {
            color: #555;
            font-size: 22px; 
            text-align: center;
            line-height: 1.5;
            margin-top: 0;
            margin-bottom: 20px;
        }

        #photo-grid img {
            width: 100%; 
            height: auto;
            border-radius: 8px;
            object-fit: cover; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div id="firstScreen">
        <button id="firstButton">CLIQUE AQUI ❤️</button>
    </div>

    <div id="countdown"></div>

    <div id="surprise"> 
        
        <h1>Para Lívia Rodrigues ❤️</h1>
        <p>
            Meu amor, você é uma mulher incrível e eu sou seu fã. Te amo meu amor e obrigado por fazer minha vida ter mais sentido.
        </p>

        <div id="photo-grid">
            <img src="foto.jpg" alt="Foto 1">
            <img src="foto2.jpg" alt="Foto 2">
            <img src="foto3.jpg" alt="Foto 3">
            <img src="foto4.jpg" alt="Foto 4">
            <img src="foto5.jpg" alt="Foto 5">
            </div>
        
    </div>

    <script>
        const firstScreen = document.getElementById('firstScreen'); 
        const firstButton = document.getElementById('firstButton');
        const surprise = document.getElementById('surprise');
        const countdownElement = document.getElementById('countdown');
        let clickIndex = 0;

        const targetPositions = [
            { x: 20, y: 20 },
            { x: 75, y: 40 }, 
            { x: 50, y: 50 }, 
            { x: 30, y: 80 }, 
            { x: 80, y: 15 }  
        ];

        function moveToNextTarget() {
            if (clickIndex < targetPositions.length) {
                const target = targetPositions[clickIndex];
                
                const newX = (window.innerWidth * target.x / 100) - (firstButton.offsetWidth / 2);
                const newY = (window.innerHeight * target.y / 100) - (firstButton.offsetHeight / 2);

                firstButton.style.left = newX + 'px';
                firstButton.style.top = newY + 'px';
            }
        }

        firstButton.addEventListener('click', () => {
            
            if (clickIndex === targetPositions.length - 1) {
                
                // Lógica de Transição
                firstButton.style.display = 'none';
                
                countdownElement.style.display = 'flex';
                countdownElement.textContent = '3';

                setTimeout(() => {
                    countdownElement.textContent = '2';
                }, 1000);

                setTimeout(() => {
                    countdownElement.textContent = '1';
                }, 2000);

                // REVELAÇÃO DA SURPRESA
                setTimeout(() => {
                    countdownElement.style.display = 'none';
                    firstScreen.style.display = 'none';
                    
                    surprise.style.visibility = 'visible'; 
                    surprise.style.opacity = '1';         
                    
                }, 3000);

                firstButton.disabled = true;

            } else {
                clickIndex++;
                moveToNextTarget();
            }
        });

        window.addEventListener('load', () => {
            moveToNextTarget();
        });
        
    </script>

</body>
</html>
