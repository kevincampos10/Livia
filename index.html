<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Lívia ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f28b8b;
            height: 100vh;
            display: flex; 
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 10; 
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background-color: #ffffff;
            color: #c0392b;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
            position: absolute;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #ffe6e6;
        }

        #surprise {
            display: none; 
            max-width: 90%;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            position: relative;
            
            flex-direction: column; 
            justify-content: center;
            align-items: center;
        }

        #surprise img {
            /* AJUSTE: Diminui a foto para 80% da largura do contêiner */
            max-width: 80%; 
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1 {
            color: #c0392b;
            /* AJUSTE: Aumenta o tamanho da fonte do título */
            font-size: 28px; 
        }

        p {
            color: #555;
            /* AJUSTE: Aumenta o tamanho da fonte do parágrafo */
            font-size: 18px; 
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container" id="firstScreen">
        <button id="firstButton">CLIQUE AQUI</button>
    </div>

    <div class="container" id="surprise">
        <h1>Para Lívia Rodrigues ❤️</h1>
        <img src="foto.jpg" alt="Nossa foto">
        <p>
            Meu amor, você é uma mulher incrível e eu sou seu fã. Te amo meu amor e obrigado por fazer minha vida ter mais sentido.
        </p>
    </div>

    <script>
        const firstScreen = document.getElementById('firstScreen'); 
        const firstButton = document.getElementById('firstButton');
        const surprise = document.getElementById('surprise');
        
        function moveButtonRandom() {
            const x = Math.random() * (window.innerWidth - firstButton.offsetWidth);
            const y = Math.random() * (window.innerHeight - firstButton.offsetHeight);
            firstButton.style.left = x + 'px';
            firstButton.style.top = y + 'px';
        }

        // Abertura com 1 clique para teste
        firstButton.addEventListener('click', () => {
            firstScreen.style.display = 'none'; 
            surprise.style.display = 'flex'; 
        });
        
        moveButtonRandom(); 
    </script>

</body>
</html>
