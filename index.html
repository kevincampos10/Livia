<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Lívia ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f28b8b;
            height: 100vh;
            display: flex; /* Centraliza TUDO na tela */
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            /* Garantimos que esta div fique na frente de tudo que for absoluto */
            z-index: 10; 
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background-color: #ffffff;
            color: #c0392b;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
            /* O botão usa posição absoluta para poder ser movido inicialmente */
            position: absolute; 
        }

        button:hover {
            transform: scale(1.05);
            background-color: #ffe6e6;
        }

        #surprise {
            display: none; /* Começa escondido */
            max-width: 90%;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            position: relative;
            
            /* Garante que o conteúdo DENTRO da surpresa seja centralizado */
            flex-direction: column; 
            justify-content: center;
            align-items: center;
        }

        #surprise img {
            max-width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1 {
            color: #c0392b;
        }

        p {
            color: #555;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container" id="firstScreen">
        <button id="firstButton">CLIQUE AQUI</button>
    </div>

    <div class="container" id="surprise">
        <h1>Para Lívia Rodrigues ❤️</h1>
        <img src="foto.jpg" alt="Nossa foto">
        <p>
            Meu amor, você é uma mulher incrível e eu sou seu fã. Te amo meu amor e obrigado por fazer minha vida ter mais sentido.
        </p>
    </div>

    <script>
        // Define as referências para os elementos
        const firstScreen = document.getElementById('firstScreen'); 
        const firstButton = document.getElementById('firstButton');
        const surprise = document.getElementById('surprise');
        
        // Função para posicionar o botão (será executada apenas uma vez para o posicionamento inicial)
        function moveButtonRandom() {
            const x = Math.random() * (window.innerWidth - firstButton.offsetWidth);
            const y = Math.random() * (window.innerHeight - firstButton.offsetHeight);
            firstButton.style.left = x + 'px';
            firstButton.style.top = y + 'px';
        }

        // Lógica de revelação da surpresa (APENAS UM CLIQUE)
        firstButton.addEventListener('click', () => {
            // AÇÃO FINAL: Esconde a tela inteira do botão e revela a surpresa centralizada
            firstScreen.style.display = 'none'; 
            surprise.style.display = 'flex'; 
        });
        
        // **REMOVIDO**: A função de 'fugir' ao passar o mouse foi removida.
        // **MODIFICADO**: A lógica de 5 cliques foi substituída por 1 clique.

        // Chama a função uma vez para posicionar o botão em algum lugar aleatório (e não no canto)
        moveButtonRandom(); 
    </script>

</body>
</html>
