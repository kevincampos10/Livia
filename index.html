<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Lívia ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to top, #ff9a9e 0%, #fecfef 100%); 
            height: 100vh;
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        /* --- ESTILOS DA TELA INICIAL (LOVE BAR) --- */
        #firstScreen {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #instruction {
            color: #c0392b;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        #loveBarContainer {
            width: 80%;
            max-width: 500px;
            height: 40px;
            background-color: #ffffff;
            border-radius: 20px;
            border: 3px solid #c0392b;
            overflow: visible; /* IMPORTANTE: Mantém o overflow: visible para os corações subirem para fora da barra */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative; /* CRÍTICO: Posição de referência para os corações */
        }

        #loveBar {
            height: 100%;
            width: 0%; 
            background-color: #ff4d4d;
            transition: width 0.1s linear;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: white;
            font-weight: bold;
        }

        /* --- NOVO ESTILO: CORAÇÃO VOADOR --- */
        .heart {
            position: absolute;
            bottom: 0; /* Começa na base da LoveBar */
            font-size: 20px;
            color: #ff4d4d; 
            pointer-events: none; /* Não interfere no clique */
            transform: translateX(-50%); /* Centraliza o coração em seu ponto X */
            animation: flyUp 1.5s ease-out forwards; /* Define a animação de voo */
        }

        /* Define como o coração se move e desaparece */
        @keyframes flyUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) translateX(-50%);
            }
            100% {
                opacity: 0;
                transform: translateY(-150px) scale(1.5) translateX(-50%); /* Move para cima 150px e cresce */
            }
        }
        /* -------------------------------------- */

        /* --- ESTILOS DA CONTAGEM REGRESSIVA (SEM ALTERAÇÃO) --- */
        #countdown {
            display: none;
            font-size: 100px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 4px 4px #c0392b;
            position: relative;
            z-index: 20;
        }

        /* --- ESTILOS DA SURPRESA (MURAL DE FOTOS - SEM ALTERAÇÃO) --- */
        #surprise {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.5s;
            background-color: transparent; 
            position: absolute; 
            max-width: 95%; 
            max-height: 95vh;
            padding: 20px;
            border-radius: 20px;
            overflow-y: auto; 
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #photo-grid {
            width: 100%;
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 25px; 
            justify-items: center;
            align-items: start;
            padding-bottom: 20px;
        }
        
        #photo-grid img {
            width: 100%; 
            height: auto;
            background-color: white; 
            padding: 5px; 
            border-radius: 2px;
            object-fit: cover; 
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: rotate(2deg);
            transition: transform 0.3s;
        }
        
        #photo-grid img:hover {
            transform: rotate(-2deg) scale(1.05);
            z-index: 100;
        }
        
        #surprise h1 {
            color: #c0392b;
            font-size: 36px; 
            margin-bottom: 5px;
            text-align: center;
        }

        #surprise p {
            color: #555;
            font-size: 22px; 
            text-align: center;
            line-height: 1.5;
            margin-top: 0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="firstScreen">
        <div id="instruction">Pressione a barra de espaço para encher a barra do amor!</div>
        <div id="loveBarContainer">
            <div id="loveBar">0%</div>
        </div>
    </div>

    <div id="countdown"></div>

    <div id="surprise"> 
        <h1>Para Lívia Rodrigues ❤️</h1>
        <p>
            Meu amor, você é uma mulher incrível e eu sou seu fã. Te amo meu amor e obrigado por fazer minha vida ter mais sentido.
        </p>
        <div id="photo-grid">
            <img src="foto.jpg" alt="Foto 1">
            <img src="foto2.jpg" alt="Foto 2">
            <img src="foto3.jpg" alt="Foto 3">
            <img src="foto4.jpg" alt="Foto 4">
            <img src="foto5.jpg" alt="Foto 5">
        </div>
    </div>

    <script>
        const firstScreen = document.getElementById('firstScreen'); 
        const surprise = document.getElementById('surprise');
        const countdownElement = document.getElementById('countdown');
        const loveBar = document.getElementById('loveBar');
        const loveBarContainer = document.getElementById('loveBarContainer'); // Referência para injetar os corações

        let loveLevel = 0; 
        const maxLove = 20; 
        let gameActive = true; 

        // NOVO: Função para criar e animar o coração
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.textContent = '❤️';
            
            // Posição aleatória ao longo da barra (5% a 95% da largura)
            const randomX = Math.random() * 90 + 5; 
            heart.style.left = randomX + '%';

            loveBarContainer.appendChild(heart);
            
            // Remove o coração do DOM após a animação (1.5 segundos, conforme o CSS)
            setTimeout(() => {
                heart.remove();
            }, 1500); 
        }

        document.addEventListener('keydown', (event) => {
            if (gameActive && (event.keyCode === 32 || event.key === ' ')) {
                event.preventDefault(); 

                if (loveLevel < maxLove) {
                    loveLevel++;
                    const percentage = Math.round((loveLevel / maxLove) * 100);
                    
                    // Atualiza a barra visual
                    loveBar.style.width = percentage + '%';
                    loveBar.textContent = percentage + '%';

                    // NOVO: Chama a função do coração a cada clique
                    createHeart(); 
                }

                if (loveLevel >= maxLove) {
                    gameActive = false; 
                    startCountdown();
                }
            }
        });

        function startCountdown() {
            firstScreen.style.display = 'none';
            countdownElement.style.display = 'flex';
            countdownElement.textContent = '3';

            setTimeout(() => {
                countdownElement.textContent = '2';
            }, 1000);

            setTimeout(() => {
                countdownElement.textContent = '1';
            }, 2000);

            setTimeout(() => {
                countdownElement.style.display = 'none';
                surprise.style.visibility = 'visible'; 
                surprise.style.opacity = '1';         
            }, 3000);
        }
    </script>

</body>
</html>
